<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cairo & Voula weather</title>
<style>
:root{color-scheme:light dark;--text:#2c2c2b;--muted:#65635f;--bg:#fff}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{padding:8px 12px;width:max-content;max-width:100%;font-size:16px;line-height:1.6}.row{display:flex;gap:10px;align-items:baseline;white-space:nowrap}.city{width:46px}.current{font-weight:650;min-width:32px}.range,.status{color:var(--muted)}.range{font-size:14px}.status{font-size:14px;white-space:normal}.status:empty{display:none}@media(prefers-color-scheme:dark){:root{--bg:#191919;--text:#fff;--muted:#b7b7b5}}@media(max-width:240px){main{padding:6px;font-size:14px}.row{gap:6px}.city{width:39px}.range{font-size:14px}}
</style>
</head>
<body>
<main aria-label="Today's weather in degrees Celsius">
<section class="row" id="cairo" aria-label="Cairo weather"><span class="city">Cairo</span><strong class="current">—°</strong><span class="range">· ↑—° ↓—°</span></section>
<p class="status" id="cairo-status" role="status">Loading…</p>
<section class="row" id="voula" aria-label="Voula weather"><span class="city">Voula</span><strong class="current">—°</strong><span class="range">· ↑—° ↓—°</span></section>
<p class="status" id="voula-status" role="status">Loading…</p>
</main>
<script>
'use strict';
const places=[{id:'cairo',name:'Cairo',lat:30.0444,lon:31.2357,tz:'Africa/Cairo'},{id:'voula',name:'Voula',lat:37.842,lon:23.776,tz:'Europe/Athens'}];
const interval=15*60*1000;
const state=new Map();
function localDate(tz){const parts=new Intl.DateTimeFormat('en-US',{timeZone:tz,year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());const val=t=>parts.find(p=>p.type===t).value;return `${val('year')}-${val('month')}-${val('day')}`;}
function blank(row){row.querySelector('.current').textContent='—°';row.querySelector('.range').textContent='· ↑—° ↓—°';}
async function refresh(p,force=false){
 const s=state.get(p.id)||{busy:false,loaded:0,date:null};state.set(p.id,s);
 if(s.busy)return;
 const date=localDate(p.tz);
 if(!force&&s.date===date&&Date.now()-s.loaded<interval)return;
 const row=document.getElementById(p.id),status=document.getElementById(p.id+'-status');
 if(s.date&&s.date!==date){blank(row);s.date=null;s.loaded=0;status.textContent='Loading…';}
 s.busy=true;
 try{
  const params=new URLSearchParams({latitude:p.lat,longitude:p.lon,current:'temperature_2m',daily:'temperature_2m_max,temperature_2m_min',timezone:p.tz,temperature_unit:'celsius',forecast_days:'1'});
  const response=await fetch('https://api.open-meteo.com/v1/forecast?'+params,{signal:AbortSignal.timeout(12000),cache:'no-store'});
  if(!response.ok)throw new Error('Weather service unavailable');
  const d=await response.json(),i=d.daily?.time?.indexOf(localDate(p.tz));
  const current=d.current?.temperature_2m,high=d.daily?.temperature_2m_max?.[i],low=d.daily?.temperature_2m_min?.[i];
  if(i<0||![current,high,low].every(Number.isFinite)||low>high||!d.current?.time)throw new Error('Invalid weather response');
  const sourceTime=d.current.time;
  const observed=Date.parse(sourceTime+'Z')-Number(d.utc_offset_seconds)*1000;
  if(!Number.isFinite(observed)||Math.abs(Date.now()-observed)>2*60*60*1000)throw new Error('Outdated current weather');
  row.querySelector('.current').textContent=Math.round(current)+'°';
  row.querySelector('.range').textContent=`· ↑${Math.round(high)}° ↓${Math.round(low)}°`;
  s.date=d.daily.time[i];s.loaded=Date.now();
  const time=new Intl.DateTimeFormat('en-GB',{timeZone:p.tz,hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(observed));
  row.title=`${p.name} · °C · Weather time ${time} (${p.tz}) · Today's forecast high/low · Open-Meteo`;
  row.setAttribute('aria-label',`${p.name}: current ${Math.round(current)} degrees Celsius, today's high ${Math.round(high)}, low ${Math.round(low)}. Weather time ${time}. Source: Open-Meteo.`);
  status.textContent='';
 }catch(e){
  if(s.date===localDate(p.tz)&&s.loaded){status.textContent='Update failed · showing earlier reading';row.title='Update failed. Last fetched '+new Date(s.loaded).toLocaleTimeString('en-GB',{timeZone:p.tz,hour:'2-digit',minute:'2-digit'})+' · '+p.tz;}
  else {blank(row);status.textContent='Weather unavailable';row.title='Weather unavailable · will retry automatically';}
 }finally{s.busy=false;}
}
function refreshAll(force=false){return Promise.all(places.map(p=>refresh(p,force)));}
refreshAll();
setInterval(()=>{if(!document.hidden)refreshAll();},60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshAll();});
window.addEventListener('online',()=>refreshAll(true));
window.addEventListener('pageshow',()=>refreshAll());
</script>
</body></html>
