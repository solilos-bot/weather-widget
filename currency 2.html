<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Daily exchange rates</title>
<style>
:root{color-scheme:light dark;--bg:#fff;--text:#2c2c2b;--muted:#66635f;--accent:#1769aa;--warn:#98500d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.widget{max-width:560px;padding:8px 12px;margin:0}.rates{display:flex;flex-direction:column;gap:4px;border:0;background:transparent}.card{display:flex;align-items:baseline;gap:16px;padding:0;border:0;border-radius:0;background:transparent;box-shadow:none}.pair{min-width:96px;white-space:nowrap;color:var(--text);font-size:16px}.value{font-size:18px;font-weight:650;line-height:1.5;font-variant-numeric:tabular-nums;letter-spacing:0}
footer{display:flex;flex-wrap:wrap;align-items:center;gap:0 12px;margin-top:8px;font-size:14px;color:var(--muted)}#updated{flex-basis:100%}a{color:var(--muted);text-underline-offset:3px;min-height:44px;display:inline-flex;align-items:center}.refresh{border:0;border-radius:0;background:transparent;color:var(--muted);padding:0 8px;min-width:64px;min-height:44px;font:inherit;font-size:14px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#status{margin:0;font-size:14px;color:var(--warn);overflow-wrap:anywhere}#status:empty{display:none}#status[data-state='success']{color:var(--muted)}
@media(prefers-color-scheme:dark){:root{--bg:#191919;--text:#fff;--muted:#b7b5b2;--accent:#5e9fe8;--warn:#efb77e}}
</style></head><body><main class="widget" aria-label="Daily currency exchange rates"><section class="rates" aria-label="Currency pairs"><div class="card"><div class="pair">USD → EGP</div><div class="value"><span id="usd-egp">—</span></div></div><div class="card"><div class="pair">EUR → EGP</div><div class="value"><span id="eur-egp">—</span></div></div><div class="card"><div class="pair">EUR → USD</div><div class="value"><span id="eur-usd">—</span></div></div></section><footer><span id="updated">Loading rates…</span><a id="source" href="https://www.exchangerate-api.com" target="_blank" rel="noopener noreferrer">Rates By Exchange Rate API</a><button class="refresh" id="refresh" type="button">Refresh</button></footer><p id="status" role="status" aria-live="polite"></p></main>
<script>
(()=>{'use strict';const endpoint='https://open.er-api.com/v6/latest/EUR',key='sol-daily-fx-v1',el=id=>document.getElementById(id);let data=null,busy=false,lastAttempt=0;
const valid=d=>d&&d.result==='success'&&d.base_code==='EUR'&&Number.isFinite(d.rates?.USD)&&d.rates.USD>0&&Number.isFinite(d.rates?.EGP)&&d.rates.EGP>0&&Number.isFinite(d.time_last_update_unix);
function draw(){if(!data)return;el('source').href=data.source_url||'https://www.exchangerate-api.com';el('source').textContent=data.source_label||'Rates By Exchange Rate API';el('usd-egp').textContent=(data.rates.EGP/data.rates.USD).toFixed(2);el('eur-egp').textContent=data.rates.EGP.toFixed(2);el('eur-usd').textContent=data.rates.USD.toFixed(4);el('updated').textContent='Rate date: '+new Intl.DateTimeFormat('en-GB',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit',timeZone:'Africa/Cairo'}).format(new Date(data.time_last_update_unix*1000))+' · Cairo';}
function stale(){return data&&Date.now()-data.time_last_update_unix*1000>48*3600000}
function due(){return !data||Date.now()>((data.time_next_update_unix||data.time_last_update_unix+86400)*1000+60000)}
async function jsonWithTimeout(url, parentSignal){
 const controller=new AbortController();let timer;const abort=()=>controller.abort();parentSignal.addEventListener('abort',abort,{once:true});
 try{return await Promise.race([
  (async()=>{const response=await fetch(url,{signal:controller.signal,cache:'no-store'});if(!response.ok)throw Error('HTTP '+response.status);return await response.json()})(),
  new Promise((_,reject)=>{timer=setTimeout(()=>{controller.abort();reject(Error('Request timed out'))},6000);controller.signal.addEventListener('abort',()=>reject(Error('Request cancelled')),{once:true})})
 ])}finally{clearTimeout(timer);parentSignal.removeEventListener('abort',abort)}
}
let active=null,requestId=0;
async function load(manual=false){
 if(!manual&&(busy||!due()||Date.now()-lastAttempt<3600000))return;
 if(active)active.abort();const controller=new AbortController();active=controller;const id=++requestId;
 busy=true;lastAttempt=Date.now();el('refresh').setAttribute('aria-busy','true');el('status').textContent='Checking latest rates…';el('status').dataset.state='success';
 try{
  let next;
  try{next=await jsonWithTimeout(endpoint,controller.signal);if(!valid(next))throw Error('Invalid rate feed')}
  catch(error){
   if(controller.signal.aborted)throw error;
   const backup=await jsonWithTimeout('https://latest.currency-api.pages.dev/v1/currencies/eur.json',controller.signal);
   const stamp=Date.parse(backup.date+'T00:00:00Z')/1000;
   next={result:'success',base_code:'EUR',rates:{USD:backup.eur?.usd,EGP:backup.eur?.egp},time_last_update_unix:stamp,time_next_update_unix:stamp+86400,source_url:'https://github.com/fawazahmed0/exchange-api',source_label:'Source: Currency API (backup)'};
   if(!valid(next))throw Error('Invalid backup feed');
  }
  if(id!==requestId)return;
  data=next;try{localStorage.setItem(key,JSON.stringify(data))}catch{}draw();
  const checked=new Intl.DateTimeFormat('en-GB',{hour:'2-digit',minute:'2-digit',second:'2-digit',timeZone:'Africa/Cairo'}).format(new Date());
  el('status').textContent=stale()?'Source rates are over 48 hours old. Check the rate date.':'Checked '+checked+' Cairo · source updates daily';
  el('status').dataset.state=stale()?'warning':'success';
 }catch{
  if(id!==requestId)return;
  el('status').textContent='Could not reach rate sources. Saved rates remain visible; tap Refresh to retry.';
  el('status').dataset.state='warning';
 }finally{
  if(id===requestId){busy=false;active=null;el('refresh').setAttribute('aria-busy','false')}
 }
}
try{const saved=JSON.parse(localStorage.getItem(key));if(valid(saved)){data=saved;draw();if(stale())el('status').textContent='Saved rates are over 48 hours old.'}}catch{}
if(!data){data={"result":"success","base_code":"EUR","time_last_update_unix":1793232151,"time_next_update_unix":1793319501,"rates":{"USD":1.114562,"EGP":62.484856}};draw();el('status').textContent='Saved snapshot · checking for updates…';}
el('refresh').addEventListener('click',()=>load(true));document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});setInterval(()=>load(),60000);load(true);})();
</script></body></html>
