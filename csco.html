<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CSCO Stock Widget</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #131722;
    }

    .chart {
      width: 100%;
      height: 360px;
    }
  </style>
</head>
<body>
  <!-- Latest available price -->
 <div class="tradingview-widget-container" style="zoom: 0.50; width: 200%;">
    <div class="tradingview-widget-container__widget"></div>
    <script
      type="text/javascript"
      src="https://s3.tradingview.com/external-embedding/embed-widget-symbol-info.js"
      async>
    {
      "symbol": "NASDAQ:CSCO",
      "width": "100%",
      "locale": "en",
      "colorTheme": "dark",
      "isTransparent": true
    }
    </script>
  </div>

  <!-- Six-month chart -->
  <div class="tradingview-widget-container chart">
    <div
      class="tradingview-widget-container__widget"
      style="height: 100%; width: 100%;">
    </div>
    <script
      type="text/javascript"
      src="https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js"
      async>
    {
      "autosize": true,
      "symbol": "NASDAQ:CSCO",
      "interval": "D",
      "range": "6M",
      "timezone": "exchange",
      "theme": "dark",
      "hide_legend": true,
      "style": "3",
      "locale": "en",
      "allow_symbol_change": false,
      "calendar": false,
      "support_host": "https://www.tradingview.com"
    }
    </script>
  </div>
</body>
</html>
