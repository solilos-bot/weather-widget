<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Today's date and time</title>
<style>
:root{color-scheme:light dark;--bg:#fff;--ink:#2c2c2b;--muted:#65625e;--line:#e6e5e3;--accent:#2783de}
@media(prefers-color-scheme:dark){:root{--bg:#191919;--ink:#fff;--muted:#b5b5b5;--line:#484848;--accent:#5e9fe8}}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{min-height:100vh;padding:8px;display:flex;align-items:center;justify-content:center}main{max-width:680px;margin:0;padding:0;text-align:center}.label{display:flex;gap:8px;align-items:center;font-size:14px;font-weight:600;color:var(--muted);letter-spacing:.09em;text-transform:uppercase}.dot{width:7px;height:7px;background:var(--accent);border-radius:50%}time{display:block;margin-top:0;font-size:clamp(18px,4vw,20px);font-weight:600;line-height:1.3;letter-spacing:-.035em}#clock{margin-top:8px;font-size:18px;font-weight:500;letter-spacing:0;font-variant-numeric:tabular-nums}.zone{margin:12px 0 0;font-size:14px;line-height:1.5;color:var(--muted)}
</style>
</head>
<body>
<main aria-label="Current date and time in Cairo"><time id="date">Loading date…</time><time id="clock">--:--</time></main>
<script>
'use strict';
const timezone='Africa/Cairo';
const formatter=new Intl.DateTimeFormat('en-GB',{timeZone:timezone,weekday:'long',day:'numeric',month:'long',year:'numeric'});
const iso=new Intl.DateTimeFormat('en-CA',{timeZone:timezone,year:'numeric',month:'2-digit',day:'2-digit'});
const node=document.getElementById('date');
const clock=document.getElementById('clock');
const clockFormatter=new Intl.DateTimeFormat('en-GB',{timeZone:timezone,hour:'2-digit',minute:'2-digit',hourCycle:'h23'});
function update(){const now=new Date();const clockText=clockFormatter.format(now);if(clock.textContent!==clockText){clock.textContent=clockText;clock.dateTime=clockText;}const text=formatter.format(now);if(node.textContent!==text){node.textContent=text;const p=Object.fromEntries(iso.formatToParts(now).map(x=>[x.type,x.value]));node.dateTime=`${p.year}-${p.month}-${p.day}`;}}
update();setInterval(update,1000);document.addEventListener('visibilitychange',update);window.addEventListener('pageshow',update);
</script>
</body></html>
